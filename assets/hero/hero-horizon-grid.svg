<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <!-- Perspective Convergence Lines to Horizon -->
  <defs>
    <linearGradient id="horizon-fade" x1="0" y1="600" x2="0" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.2)"/>
      <stop offset="60%" stop-color="rgba(56, 189, 248, 0.04)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.0)"/>
    </linearGradient>
  </defs>
  <!-- Horizon Line -->
  <line x1="0" y1="620" x2="1920" y2="620" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  <!-- Perspective Ray Grid radiating from central vanish point (960, 620) -->
  <g stroke="url(#horizon-fade)" stroke-width="1">
    <line x1="960" y1="620" x2="-200" y2="1080"/>
    <line x1="960" y1="620" x2="100" y2="1080"/>
    <line x1="960" y1="620" x2="400" y2="1080"/>
    <line x1="960" y1="620" x2="700" y2="1080"/>
    <line x1="960" y1="620" x2="960" y2="1080"/>
    <line x1="960" y1="620" x2="1220" y2="1080"/>
    <line x1="960" y1="620" x2="1520" y2="1080"/>
    <line x1="960" y1="620" x2="1820" y2="1080"/>
    <line x1="960" y1="620" x2="2120" y2="1080"/>
  </g>
  <!-- Orthogonal depth transverse lines -->
  <line x1="480" y1="660" x2="1440" y2="660" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
  <line x1="360" y1="720" x2="1560" y2="720" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>
  <line x1="200" y1="820" x2="1720" y2="820" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1"/>
  <line x1="0" y1="960" x2="1920" y2="960" stroke="rgba(56, 189, 248, 0.06)" stroke-width="1"/>
</svg>
