<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <!-- Midground Structural Portal Frames -->
  <!-- Left Portal Pillar -->
  <rect x="80" y="80" width="120" height="920" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.25" fill="none"/>
  <line x1="80" y1="80" x2="200" y2="80" stroke="#38bdf8" stroke-width="2"/>
  <line x1="80" y1="200" x2="200" y2="200" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <line x1="80" y1="540" x2="200" y2="540" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <!-- Right Portal Pillar -->
  <rect x="1720" y="80" width="120" height="920" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.25" fill="none"/>
  <line x1="1720" y1="80" x2="1840" y2="80" stroke="#38bdf8" stroke-width="2"/>
  <line x1="1720" y1="200" x2="1840" y2="200" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <line x1="1720" y1="540" x2="1840" y2="540" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
  <!-- Top Spatial Lintel -->
  <line x1="200" y1="120" x2="1720" y2="120" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" stroke-dasharray="6 6"/>
</svg>
