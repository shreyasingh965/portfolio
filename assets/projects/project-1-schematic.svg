<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <!-- Container Framing -->
  <rect x="1" y="1" width="598" height="338" rx="6" fill="#12141a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <path d="M 1 30 L 1 1 L 30 1 M 570 1 L 599 1 L 599 30 M 599 310 L 599 339 L 570 339 M 30 339 L 1 339 L 1 310" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Subtle Background Grid -->
  <line x1="1" y1="80" x2="599" y2="80" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  <line x1="1" y1="170" x2="599" y2="170" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  <line x1="1" y1="260" x2="599" y2="260" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  
  <!-- Stage 1: Ingestion & Preprocessing -->
  <rect x="30" y="120" width="100" height="100" rx="4" fill="#181b22" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="80" y="160" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#38bdf8" letter-spacing="1">HAM10000</text>
  <text x="80" y="180" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9" fill="#8e929b">Image Tensor</text>
  
  <!-- Connector 1 -->
  <path d="M 130 170 L 170 170" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Stage 2: Dual Branch CNN + ViT -->
  <!-- Branch A: CNN Local Features -->
  <path d="M 170 170 L 190 110 L 210 110" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.25"/>
  <rect x="210" y="80" width="140" height="60" rx="4" fill="#181b22" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <text x="280" y="106" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#f2f3f5">CNN Branch</text>
  <text x="280" y="124" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8.5" fill="#8e929b">Local Texture Extraction</text>
  
  <!-- Branch B: ViT Global Self-Attention -->
  <path d="M 170 170 L 190 230 L 210 230" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.25"/>
  <rect x="210" y="200" width="140" height="60" rx="4" fill="#181b22" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <text x="280" y="226" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#f2f3f5">ViT Transformer</text>
  <text x="280" y="244" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8.5" fill="#8e929b">Multi-Head Self-Attention</text>
  
  <!-- Convergence Node -->
  <path d="M 350 110 L 380 170 L 400 170" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.25"/>
  <path d="M 350 230 L 380 170" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.25"/>
  
  <!-- Stage 3: Explainable AI & RAG Reasoning Core -->
  <rect x="400" y="110" width="160" height="120" rx="4" fill="#181b22" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="145" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#38bdf8" font-weight="600">Grad-CAM + XAI</text>
  <text x="480" y="165" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9" fill="#f2f3f5">Attention Saliency Maps</text>
  <line x1="420" y1="180" x2="540" y2="180" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="480" y="200" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#8e929b">RAG Medical Reasoning</text>
  <text x="480" y="216" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8" fill="#4b4f59">Clinical Decision Support</text>
  
  <!-- Header Identification Tag -->
  <text x="30" y="45" font-family="'Geist Mono', monospace" font-size="9" fill="#38bdf8" letter-spacing="1">SYSTEM ARCHITECTURE · CNN–VIT DUAL-BRANCH & XAI</text>
</svg>
