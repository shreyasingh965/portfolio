  <text x="500" y="168" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8.5" fill="#8e929b">Real-Time Inference</text>
  <line x1="445" y1="182" x2="555" y2="182" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="500" y="202" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#38bdf8">Scalable Workflows</text>
  <text x="500" y="216" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8" fill="#4b4f59">Backend Prediction Service</text>
  
  <!-- Header Identification Tag -->
