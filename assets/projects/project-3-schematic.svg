  <text x="100" y="168" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8.5" fill="#8e929b">Pandas & NumPy Pipelines</text>
  <line x1="45" y1="182" x2="155" y2="182" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="100" y="202" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#38bdf8">DSA Optimization</text>
  <text x="100" y="216" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8" fill="#4b4f59">Feature Engineering</text>
  
  <!-- Connector 1 -->
  <path d="M 170 170 L 220 170" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- Stage 2: Machine Learning Classifier (82% Accuracy) -->
  <rect x="220" y="105" width="160" height="130" rx="4" fill="#181b22" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300" y="140" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#38bdf8" font-weight="600">Scikit-learn Model</text>
  <text x="300" y="158" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8.5" fill="#8e929b">Accident Severity Classifier</text>
  <line x1="235" y1="175" x2="365" y2="175" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  <text x="300" y="196" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="13" fill="#f2f3f5" font-weight="700">82% ACCURACY</text>
  <text x="300" y="214" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8" fill="#4b4f59">Evaluated Validation Metric</text>
  
  <!-- Connector 2 -->
  <path d="M 380 170 L 430 170" stroke="#38bdf8" stroke-width="1.5"/>
  
  <!-- Stage 3: Real-Time RESTful Inference API (Flask) -->
  <rect x="430" y="115" width="140" height="110" rx="4" fill="#181b22" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
