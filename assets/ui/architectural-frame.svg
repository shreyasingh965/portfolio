<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" fill="none">
  <!-- Outer Orthogonal Boundary -->
  <rect x="20" y="20" width="960" height="560" rx="4" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.25"/>
  <!-- Corner Registration Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 950 20 L 980 20 L 980 50" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 980 550 L 980 580 L 950 580" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 50 580 L 20 580 L 20 550" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <!-- Technical Tick Marks along Border -->
  <line x1="20" y1="150" x2="30" y2="150" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <line x1="20" y1="300" x2="35" y2="300" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="20" y1="450" x2="30" y2="450" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <line x1="980" y1="150" x2="970" y2="150" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <line x1="980" y1="300" x2="965" y2="300" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="980" y1="450" x2="970" y2="450" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <!-- Internal Horizon Guide -->
  <line x1="60" y1="300" x2="940" y2="300" stroke="rgba(56, 189, 248, 0.18)" stroke-width="0.75" stroke-dasharray="8 6"/>
</svg>
