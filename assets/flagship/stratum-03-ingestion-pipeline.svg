<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="100%" height="100%" fill="none">
  <!-- Stratum 03 Panel Frame -->
  <rect x="1" y="1" width="718" height="158" rx="4" fill="#12141a" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.25"/>
  <!-- Status Badge & Stratum Identity -->
  <rect x="20" y="18" width="85" height="22" rx="3" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="62" y="33" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#38bdf8" font-weight="700">STRATUM 03</text>
  <text x="120" y="34" font-family="'Geist Mono', monospace" font-size="11" fill="#f2f3f5" font-weight="600">PREPROCESSING PIPELINE & HAM10000 INGESTION LEDGER</text>
  
  <!-- Architectural Blocks -->
  <!-- Block A: Raw HAM10000 Data Ingestion -->
  <rect x="20" y="58" width="190" height="80" rx="3" fill="#181b22" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="115" y="86" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#f2f3f5">HAM10000 Ingestion</text>
  <text x="115" y="104" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8.5" fill="#8e929b">Dermatoscopic Image Archive</text>
  <text x="115" y="122" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4b4f59">Multi-Class Diagnostic Ground Truth</text>
  
  <!-- Inter-block connector -->
  <path d="M 210 98 L 245 98" stroke="#38bdf8" stroke-width="1.25"/>
  
  <!-- Block B: OpenCV Computer Vision Preprocessing -->
  <rect x="245" y="58" width="220" height="80" rx="3" fill="#181b22" stroke="#38bdf8" stroke-width="1"/>
  <text x="355" y="86" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" fill="#38bdf8" font-weight="600">OpenCV Transformation</text>
  <text x="355" y="104" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8.5" fill="#f2f3f5">Image Normalization & Resize</text>
  <text x="355" y="122" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#8e929b">Artifact Removal & Color Calibration</text>
  
  <!-- Inter-block connector -->
  <path d="M 465 98 L 500 98" stroke="#38bdf8" stroke-width="1.25"/>
  
  <!-- Block C: NumPy / Pandas Feature Ledger -->
  <rect x="500" y="58" width="200" height="80" rx="3" fill="#181b22" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
