  <text x="600" y="104" text-anchor="middle" font-family="'Geist', sans-serif" font-size="8.5" fill="#8e929b">NumPy & Pandas Processing</text>
  <text x="600" y="122" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#4b4f59">Augmentation & Batch Ingestion</text>
